# Concern ownership registry (architecture-control layer).
#
# Every first-party markdown document belongs to exactly one concern.
# `architecture/compiler.py check` fails when a docs/*.md file is undeclared,
# when a canonical document has two owners, or when a generated document is
# hand-maintained (generated documents must contain the
# <!-- architecture-status:start --> / <!-- architecture-status:end --> block
# and nothing else in the generated region is authored by hand).
#
# A new design document cannot quietly become an unofficial fourth
# specification: adding one requires declaring it here.

documents:
  behavioral-architecture:
    kind: canonical
    files:
      - docs/blueprint.md

  cuda-execution:
    kind: canonical
    files:
      - docs/cuda_engineering.md

  delivery:
    kind: canonical
    files:
      - docs/construction_plan.md

  implementation-evidence:
    kind: generated
    files:
      - docs/IMPLEMENTATION_STATUS.md

  observations:
    kind: operational
    files:
      - docs/arch-signals.md

  work-queue:
    kind: operational
    files:
      - TODO.md

  readme:
    kind: operational
    files:
      - README.md

  agent-protocol:
    kind: operational
    files:
      - AGENTS.md

# Capabilities whose runtime behavior is still `planned` may not be asserted
# in present tense in the status surface documents listed below.
# compiler.py check fails on matches. Future prose uses "will", "planned",
# "specified to", or "after activation".
#
# The predictor role (I2) is implemented; its entry is removed rather than
# left stale. Re-add an entry only for a capability the build inventory marks
# missing or partial.
capability-drift: {}
