# acceptance, and production runs until every item below is `implemented`.
# compiler.py check validates:
#   - every `### I<n>` heading in construction_plan.md has exactly one entry
#     here and no entry exists without a heading;
#   - status is one of missing | partial | implemented;
#   - non-missing items name mechanisms that resolve to file::anchor;
#   - missing items name no mechanisms;
#   - the generated status file renders this table, so the build state has no
#     hand-maintained prose to drift.
