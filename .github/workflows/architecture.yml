name: architecture

on:
  push:
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pyyaml
      - name: Host unit tests
        run: make check
      - name: Architecture check (golden status)
        run: python architecture/compiler.py check --golden --strict
      - name: Source gates (strict)
        run: python architecture/source_gates.py --strict
      - name: Architecture negative tests
        run: python -m unittest discover -s tests/architecture
