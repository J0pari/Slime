<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NCA MNIST — Live Inference v2</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 24px;
    gap: 24px;
}
.panel {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 20px;
    backdrop-filter: blur(20px);
}
.panel h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 16px;
}
.main-col { display: flex; flex-direction: column; gap: 20px; align-items: center; }
.side-col { display: flex; flex-direction: column; gap: 20px; width: 240px; }

canvas#canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: crosshair;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 4px;
    background: #000;
}

.toolbar { display: flex; align-items: flex-end; gap: 8px; }
.tool-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer; padding: 6px 8px; border-radius: 8px;
    border: 1px solid transparent; transition: all 0.15s;
    background: transparent; color: #e0e0e0; min-width: 48px; overflow: visible;
}
.tool-item:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
.tool-item.active { background: rgba(0,255,136,0.1); border-color: rgba(0,255,136,0.4); color: #00ff88; }
.tool-item.active .tool-icon { border-color: rgba(0,255,136,0.5); }
.tool-item.danger:hover { background: rgba(255,51,102,0.1); }
.tool-icon {
    width: 60px; height: 60px; display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
    background: rgba(255,255,255,0.03); transition: all 0.15s; overflow: visible;
}
.tool-icon svg { transition: all 0.15s; overflow: visible; }
.tool-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.8px; opacity: 0.5; }
.tool-sep { width: 1px; height: 36px; background: rgba(255,255,255,0.08); margin: 0 4px; align-self: center; }
.size-slider { display: flex; align-items: center; gap: 6px; margin-left: 8px; }
.size-slider input[type=range] { width: 80px; accent-color: #00ff88; }
.size-slider .val { font-size: 11px; color: #00ff88; font-family: 'Consolas', monospace; min-width: 24px; }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    padding: 10px 12px;
}
.stat-label { font-size: 10px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; }
.stat-value { font-size: 22px; font-weight: 600; font-family: 'Consolas', monospace; color: #00ff88; margin-top: 2px; }

.status { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 12px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff3366; transition: background 0.3s; }
.status-dot.ok { background: #00ff88; }
.status-dot.wait { background: #ffaa00; }

.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: rgba(255,255,255,0.6); }
.legend-swatch { width: 12px; height: 12px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.1); }
</style>
</head>
<body>
<div class="main-col">
    <div class="panel">
        <h2>NCA MNIST — Live Classification</h2>
        <div class="status">
            <div class="status-dot" id="status-dot"></div>
            <span id="status-text">Connecting...</span>
        </div>
        <canvas id="canvas" width="560" height="560"></canvas>
    </div>
    <div class="panel">
        <div class="toolbar">
            <button class="tool-item active" id="pen-btn">
                <div class="tool-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></div>
                <span class="tool-label">Pen</span>
            </button>
            <button class="tool-item" id="brush-btn">
                <div class="tool-icon"><svg id="brush-icon-svg" viewBox="0 0 64 64" fill="currentColor"><circle id="brush-dot" cx="32" cy="32" r="16"/></svg></div>
                <span class="tool-label">Brush</span>
            </button>
            <button class="tool-item" id="erase-btn">
                <div class="tool-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg></div>
                <span class="tool-label">Eraser</span>
            </button>
            <div class="tool-sep"></div>
            <button class="tool-item danger" id="clear-btn">
                <div class="tool-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff3366" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></div>
                <span class="tool-label" style="color:#ff3366">Clear</span>
            </button>
            <div class="tool-sep"></div>
            <div class="size-slider">
                <input type="range" id="brush-size" min="0.3" max="2" value="0.8" step="0.1">
                <span class="val" id="brush-val">0.8</span>
            </div>
        </div>
    </div>
</div>
<div class="side-col">
    <div class="panel">
        <h2>Statistics</h2>
        <div class="stat-card" style="margin-bottom: 10px;">
            <div class="stat-label">Predictions</div>
            <div class="stat-value" id="stat-predictions" style="font-size: 14px; line-height: 1.6;">&mdash;</div>
        </div>
        <div class="stat-grid">
            <div class="stat-card">
                <div class="stat-label">Shapes</div>
                <div class="stat-value" id="stat-shapes">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Agreement</div>
                <div class="stat-value" id="stat-agreement">&mdash;</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Step</div>
                <div class="stat-value" id="stat-step">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Alive</div>
                <div class="stat-value" id="stat-alive">0</div>
            </div>
        </div>
    </div>
    <div class="panel">
        <h2>Color legend</h2>
        <div class="legend" id="legend"></div>
    </div>
</div>

<script>
const G = 28, NC = G * G, CH = 20, CH_CLS = 10, CH_CLS_OFF = CH - CH_CLS;
const ALIVE_TH = 0.1;

const COLORS = [
    [128,   0,   0],
    [230,  25,  75],
    [ 70, 240, 240],
    [210, 245,  60],
    [250, 190, 190],
    [170, 110,  40],
    [170, 255, 195],
    [165, 163, 159],
    [  0, 128, 128],
    [128, 128,   0]
];

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const backCanvas = document.createElement('canvas');
backCanvas.width = G; backCanvas.height = G;
const backCtx = backCanvas.getContext('2d');
backCtx.fillStyle = '#000';
backCtx.fillRect(0, 0, G, G);

const renderBuf = document.createElement('canvas');
renderBuf.width = G; renderBuf.height = G;
const renderCtx = renderBuf.getContext('2d');

const cellCls = new Uint8Array(NC);
const cellAlpha = new Float32Array(NC);
const localPixels = new Float32Array(NC);
const prevSentPixels = new Float32Array(NC);

let drawing = false;
let erasing = false;
let lastPos = null;
let ws = null;
let connected = false;
let stepCount = 0;
let brushRadius = 0.8;
let activeTool = 'pen';
let sendTimer = null;
let dirtyPixels = new Set();
let hasDrawn = false;
let hasClassification = false;

function getDrawRadius() {
    return activeTool === 'pen' ? 0.035 : brushRadius;
}

function strokeDot(x, y) {
    const r = getDrawRadius();
    backCtx.fillStyle = erasing ? '#000' : '#fff';
    backCtx.beginPath();
    backCtx.arc(x, y, r, 0, Math.PI * 2);
    backCtx.fill();
    markDirty(x, y, r);
}

function strokeLine(x0, y0, x1, y1) {
    const r = getDrawRadius();
    const dist = Math.hypot(x1 - x0, y1 - y0);
    const steps = Math.max(1, Math.ceil(dist / (r * 0.5)));
    for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        strokeDot(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t);
    }
}

function markDirty(cx, cy, r) {
    const minX = Math.max(0, Math.floor(cx - r - 1));
    const maxX = Math.min(G - 1, Math.ceil(cx + r + 1));
    const minY = Math.max(0, Math.floor(cy - r - 1));
    const maxY = Math.min(G - 1, Math.ceil(cy + r + 1));
    for (let y = minY; y <= maxY; y++)
        for (let x = minX; x <= maxX; x++)
            dirtyPixels.add(y * G + x);
}

function canvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    return [(e.clientX - rect.left) / rect.width * G,
            (e.clientY - rect.top) / rect.height * G];
}

canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('pointerdown', e => {
    drawing = true;
    erasing = activeTool === 'erase';
    canvas.setPointerCapture(e.pointerId);
    const [x, y] = canvasCoords(e);
    strokeDot(x, y);
    lastPos = [x, y];
    hasDrawn = true;
    render();
    scheduleSend();
});

canvas.addEventListener('pointermove', e => {
    if (!drawing) return;
    const [x, y] = canvasCoords(e);
    if (lastPos) strokeLine(lastPos[0], lastPos[1], x, y);
    lastPos = [x, y];
    render();
    scheduleSend();
});

canvas.addEventListener('pointerup', e => {
    drawing = false;
    lastPos = null;
    flushSend();
});

canvas.addEventListener('pointerleave', e => {
    if (drawing) {
        drawing = false;
        lastPos = null;
        flushSend();
    }
});

function scheduleSend() {
    if (sendTimer !== null) return;
    sendTimer = setTimeout(flushSend, 16);
}

function flushSend() {
    if (sendTimer !== null) {
        clearTimeout(sendTimer);
        sendTimer = null;
    }
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    if (dirtyPixels.size === 0) return;

    const id = backCtx.getImageData(0, 0, G, G);
    for (let i = 0; i < NC; i++) localPixels[i] = id.data[i * 4] / 255.0;

    const changed = [];
    for (const idx of dirtyPixels) {
        if (localPixels[idx] !== prevSentPixels[idx]) {
            changed.push(idx);
            prevSentPixels[idx] = localPixels[idx];
        }
    }
    dirtyPixels.clear();

    if (changed.length === 0) return;
    ws.send(localPixels.buffer);
}

function sendFullImage() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const id = backCtx.getImageData(0, 0, G, G);
    for (let i = 0; i < NC; i++) {
        localPixels[i] = id.data[i * 4] / 255.0;
        prevSentPixels[i] = localPixels[i];
    }
    dirtyPixels.clear();
    ws.send(localPixels.buffer);
}

function render() {
    if (!hasClassification) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(backCanvas, 0, 0, canvas.width, canvas.height);
        return;
    }

    const id = renderCtx.createImageData(G, G);
    const d = id.data;
    const aliveMask = new Uint8Array(NC);
    const cellClass = new Int32Array(NC);
    let alive = 0;

    for (let i = 0; i < NC; i++) {
        const a = cellAlpha[i];
        if (a <= ALIVE_TH) {
            d[i*4] = 0; d[i*4+1] = 0; d[i*4+2] = 0; d[i*4+3] = 255;
            continue;
        }
        aliveMask[i] = 1;
        cellClass[i] = cellCls[i];
        alive++;
        const col = COLORS[cellCls[i]];
        const alpha = Math.min(255, Math.max(0, Math.round(a * 255)));
        d[i*4] = col[0]; d[i*4+1] = col[1]; d[i*4+2] = col[2]; d[i*4+3] = alpha;
    }

    renderCtx.putImageData(id, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(renderBuf, 0, 0, canvas.width, canvas.height);

    const { labels, count: shapeCount } = floodFill(aliveMask);
    const shapeVotes = [];
    for (let s = 0; s < shapeCount; s++) shapeVotes.push(new Int32Array(CH_CLS));
    for (let i = 0; i < NC; i++) {
        if (labels[i] >= 0) shapeVotes[labels[i]][cellClass[i]]++;
    }

    const shapePreds = [];
    for (let s = 0; s < shapeCount; s++) {
        let best = 0, bestCount = 0, total = 0;
        for (let c = 0; c < CH_CLS; c++) {
            total += shapeVotes[s][c];
            if (shapeVotes[s][c] > bestCount) { bestCount = shapeVotes[s][c]; best = c; }
        }
        if (total < 8) continue;
        shapePreds.push({ digit: best, agree: (bestCount / total * 100).toFixed(0), total });
    }

    const predEl = document.getElementById('stat-predictions');
    if (shapePreds.length > 0) {
        predEl.innerHTML = shapePreds.map(p =>
            `<span style="color:rgb(${COLORS[p.digit].join(',')})"><b>${p.digit}</b></span> <span style="opacity:0.5">${p.agree}%</span>`
        ).join(' &nbsp; ');
    } else {
        predEl.textContent = '\u2014';
    }

    document.getElementById('stat-shapes').textContent = shapePreds.length;

    let totalVotes = 0, maxVote = 0;
    const globalVotes = new Int32Array(CH_CLS);
    for (let i = 0; i < NC; i++) {
        if (aliveMask[i]) { globalVotes[cellClass[i]]++; totalVotes++; }
    }
    for (let c = 0; c < CH_CLS; c++) { if (globalVotes[c] > maxVote) maxVote = globalVotes[c]; }

    document.getElementById('stat-agreement').textContent =
        totalVotes > 0 ? (maxVote / totalVotes * 100).toFixed(1) + '%' : '\u2014';
    document.getElementById('stat-alive').textContent = alive;
}

function floodFill(aliveMask) {
    const labels = new Int32Array(NC);
    labels.fill(-1);
    let nextLabel = 0;
    const queue = [];
    for (let i = 0; i < NC; i++) {
        if (!aliveMask[i] || labels[i] >= 0) continue;
        const label = nextLabel++;
        labels[i] = label;
        queue.push(i);
        while (queue.length > 0) {
            const cur = queue.pop();
            const cx = cur % G, cy = (cur - cx) / G;
            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    if (dx === 0 && dy === 0) continue;
                    const nx = cx + dx, ny = cy + dy;
                    if (nx < 0 || nx >= G || ny < 0 || ny >= G) continue;
                    const ni = ny * G + nx;
                    if (aliveMask[ni] && labels[ni] < 0) {
                        labels[ni] = label;
                        queue.push(ni);
                    }
                }
            }
        }
    }
    return { labels, count: nextLabel };
}

function setTool(tool) {
    activeTool = tool;
    document.getElementById('pen-btn').classList.toggle('active', tool === 'pen');
    document.getElementById('brush-btn').classList.toggle('active', tool === 'brush');
    document.getElementById('erase-btn').classList.toggle('active', tool === 'erase');
    canvas.style.cursor = tool === 'erase' ? 'cell' : 'crosshair';
}
document.getElementById('pen-btn').addEventListener('click', () => setTool('pen'));
document.getElementById('brush-btn').addEventListener('click', () => setTool('brush'));
document.getElementById('erase-btn').addEventListener('click', () => setTool('erase'));
setTool('pen');

document.getElementById('clear-btn').addEventListener('click', () => {
    backCtx.fillStyle = '#000';
    backCtx.fillRect(0, 0, G, G);
    cellCls.fill(0);
    cellAlpha.fill(0);
    localPixels.fill(0);
    prevSentPixels.fill(0);
    dirtyPixels.clear();
    hasDrawn = false;
    hasClassification = false;
    stepCount = 0;
    document.getElementById('stat-step').textContent = '0';
    document.getElementById('stat-predictions').textContent = '\u2014';
    document.getElementById('stat-shapes').textContent = '0';
    document.getElementById('stat-agreement').textContent = '\u2014';
    document.getElementById('stat-alive').textContent = '0';
    render();
    sendFullImage();
});

function updateBrushIcon() {
    document.getElementById('brush-dot').setAttribute('r', brushRadius * 20);
}
const brushSlider = document.getElementById('brush-size');
brushSlider.addEventListener('input', () => {
    brushRadius = parseFloat(brushSlider.value);
    document.getElementById('brush-val').textContent = brushRadius.toFixed(1);
    updateBrushIcon();
});
updateBrushIcon();

function updateLegend() {
    const el = document.getElementById('legend');
    el.innerHTML = '';
    for (let i = 0; i < 10; i++) {
        const item = document.createElement('div');
        item.className = 'legend-item';
        const swatch = document.createElement('div');
        swatch.className = 'legend-swatch';
        swatch.style.background = `rgb(${COLORS[i].join(',')})`;
        item.appendChild(swatch);
        item.appendChild(document.createTextNode(i));
        el.appendChild(item);
    }
}

function connect() {
    const dot = document.getElementById('status-dot');
    const txt = document.getElementById('status-text');
    dot.className = 'status-dot wait';
    txt.textContent = 'Connecting...';

    ws = new WebSocket('ws://127.0.0.1:8765');
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => {
        connected = true;
        dot.className = 'status-dot ok';
        txt.textContent = 'Connected \u2014 draw a digit';
        if (hasDrawn) sendFullImage();
    };

    let renderPending = false;
    ws.onmessage = (e) => {
        if (e.data.byteLength !== NC * CH * 4) return;
        const state = new Float32Array(e.data);
        for (let cell = 0; cell < NC; cell++) {
            const base = cell * CH;
            cellAlpha[cell] = state[base];
            let best = 0, bestVal = -1e30;
            for (let c = 0; c < CH_CLS; c++) {
                const v = state[base + CH_CLS_OFF + c];
                if (v > bestVal) { bestVal = v; best = c; }
            }
            cellCls[cell] = best;
        }
        hasClassification = true;
        stepCount++;
        if (!renderPending) {
            renderPending = true;
            requestAnimationFrame(() => {
                renderPending = false;
                document.getElementById('stat-step').textContent = stepCount;
                render();
            });
        }
    };

    ws.onclose = () => {
        connected = false;
        dot.className = 'status-dot';
        txt.textContent = 'Disconnected \u2014 retrying...';
        setTimeout(connect, 2000);
    };

    ws.onerror = () => { ws.close(); };
}

updateLegend();
render();
connect();
</script>
</body>
</html>
